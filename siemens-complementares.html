<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complementares · Siemens</title>
<meta name="description" content="Central de entrega de fotos — Siemens. Produção Master Shot / happy.">
<style>
  :root{
    --petrol:#A6791E;
    --petrol-d:#87611A;
    --ink:#000028;
    --muted:#5b6472;
    --line:#e7eaee;
    --bg:#f4f6f8;
    --card:#ffffff;
    --chip:#FAF3E3;
    --soon:#93a0af;
    --shadow:0 1px 2px rgba(0,0,40,.04),0 8px 24px rgba(0,0,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --petrol:#E3B94E;--petrol-d:#C99A3B;--ink:#eef2f6;--muted:#9aa6b4;
      --line:#243040;--bg:#0c1118;--card:#141b25;--chip:#26200F;--soon:#5b6675;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --petrol:#E3B94E;--petrol-d:#C99A3B;--ink:#eef2f6;--muted:#9aa6b4;
    --line:#243040;--bg:#0c1118;--card:#141b25;--chip:#26200F;--soon:#5b6675;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 16px 56px;}

  header{padding:26px 0 20px;}
  .brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brandbar img{height:48px;width:48px;border-radius:11px;display:block;box-shadow:var(--shadow);}

  .hero{margin-top:30px;}
  .kick{color:var(--petrol);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px;}
  h1{font-size:30px;line-height:1.15;margin:8px 0 6px;font-weight:800;letter-spacing:-.01em;}
  .sub{color:var(--muted);font-size:15px;margin:0;}

  .total{
    margin-top:24px;background:linear-gradient(135deg,var(--petrol),var(--petrol-d));
    color:#fff;border-radius:16px;padding:22px 24px;display:flex;align-items:baseline;gap:14px;
    box-shadow:var(--shadow);flex-wrap:wrap;
  }
  .total .n{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;}
  .total .lab{font-size:15px;font-weight:600;opacity:.95;}
  .total .note{margin-left:auto;font-size:12.5px;opacity:.9;max-width:290px;}

  .grid{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:660px){ .grid{grid-template-columns:1fr;} }
  .col{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;box-shadow:var(--shadow);}
  .col h2{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;}
  .col .cdesc{color:var(--muted);font-size:13.5px;margin:3px 0 0;}
  .col .big{font-size:38px;font-weight:800;color:var(--petrol);line-height:1;margin:16px 0 2px;letter-spacing:-.02em;}
  .col .biglab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}

  .day{margin-top:16px;}
  .dayhead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .dayhead .soon{font-size:10px;font-weight:700;color:var(--soon);background:var(--chip);
    border-radius:20px;padding:2px 9px;letter-spacing:.04em;text-transform:none;}
  .rows{display:flex;flex-direction:column;gap:9px;}
  .row{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:11px;padding:11px 13px;}
  .row .rn{font-size:20px;font-weight:800;min-width:46px;color:var(--ink);}
  .row .rl{font-size:14px;font-weight:600;color:var(--ink);}
  .row .rl small{display:block;font-weight:500;color:var(--muted);font-size:12px;}
  .row .btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .row a.btn{text-decoration:none;font-size:13px;font-weight:700;color:#fff;background:var(--petrol);
    padding:8px 14px;border-radius:9px;white-space:nowrap;transition:background .15s;}
  .row a.btn:hover{background:var(--petrol-d);}
  @media (max-width:520px){ .row{flex-wrap:wrap;} .row .btns{margin-left:0;width:100%;justify-content:flex-start;} }
  .soonstrip{background:var(--chip);border:1px dashed var(--line);border-radius:11px;padding:12px 13px;
    color:var(--soon);font-size:13px;font-weight:600;text-align:center;}

  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;}
  footer b{color:var(--ink);}
  .theme{cursor:pointer;background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:5px 10px;font-size:12px;font-family:inherit;}
</style>
</head>

    <div class="hero">
      <div class="kick">Complementares</div>
      <h1 id="titulo">Siemens Life 2026</h1>
      <p class="sub" id="sub">Registro fotográfico — acesso às fotos entregues.</p>
    </div>
  </header>

  <div class="total">
    <span class="n" id="totalN">0</span>
    <span class="lab">fotos entregues</span>
    <span class="note">Os números refletem apenas as fotos já finalizadas e disponibilizadas.</span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <div>Produção <b id="prod">Master Shot</b> · agência <b id="ag">happy</b> — para <b id="cli">Siemens</b></div>
    <button class="theme" id="theme">Tema</button>
  </footer>
</div>

<script>
  const DADOS = {
    cliente: "Siemens",
    agencia: "happy",
    produtora: "Master Shot",
    evento: "Siemens Life 2026 — Complementares",
    subtitulo: "Imagens complementares — fora da seleção principal.",
    colecoes: [
      {
        nome: "Siemens Life",
        desc: "Fotos da empresa",
        dias: [
          { dia: "Dia 01", grupos: [
            { rotulo:"Complementares", obs:"imagens adicionais", n:62, url:"https://drive.google.com/drive/folders/1R6jkE2jkA2LlkLr9pdE2cmLErxycYkZk?usp=sharing" }
          ]},
          { dia: "Dia 02", grupos: [] }
        ]
      },
      {
        nome: "Siemens Fundo Neutro",
        desc: "Fotos complementares — com o fundo (JPEG) e recortada (PNG)",
        dias: [
          { dia: "Dia 01", grupos: [
            { formatos:[
              { rotulo:"Com fundo (JPEG)", obs:"imagens adicionais", n:74, url:"https://drive.google.com/drive/folders/13N7HjfBuaGyrLCR-ChvRojmLfhsS0F-D?usp=sharing" },
              { rotulo:"Recortadas (PNG)", obs:"imagens adicionais", n:10, url:"https://drive.google.com/drive/folders/1ATmrGcRLQibK3PZEye62yE6qbJtfdE-4?usp=sharing" }
            ]}
          ]},
          { dia: "Dia 02", grupos: [] }
        ]
      }
    ]
  };

  document.getElementById('titulo').textContent = DADOS.evento;
  document.getElementById('sub').textContent = DADOS.subtitulo;
  document.getElementById('prod').textContent = DADOS.produtora;
  document.getElementById('ag').textContent = DADOS.agencia;
  document.getElementById('cli').textContent = DADOS.cliente;
  document.getElementById('logoAg').alt = DADOS.agencia;
  document.getElementById('logoCli').alt = DADOS.cliente;

  const fmt = n => (n||0).toLocaleString('pt-BR');
  let total = 0;
  const grid = document.getElementById('grid');

  DADOS.colecoes.forEach(c => {
    let cTot = 0;
    const gCount = g => g.formatos ? Math.max.apply(null, g.formatos.map(f=>f.n)) : g.n;
    const diasHtml = c.dias.map(d => {
      const known = d.grupos.filter(g => gCount(g) != null);
      if (known.length === 0) {
        return `<div class="day"><div class="dayhead">${d.dia} <span class="soon">em breve</span></div>
                  <div class="soonstrip">Fotos em produção</div></div>`;
      }
      const dTot = known.reduce((s,g)=>s+gCount(g),0); cTot += dTot;
      const rowHtml = (n,rotulo,obs,url) => `
        <div class="row">
          <span class="rn">${fmt(n)}</span>
          <span class="rl">${rotulo}<small>${obs||''}</small></span>
          <span class="btns"><a class="btn" href="${url}" target="_blank" rel="noopener">Ver fotos</a></span>
        </div>`;
      const rows = d.grupos.map(g => {
        if (g.formatos) {
          return g.formatos.map(f => rowHtml(f.n, f.rotulo, f.obs, f.url)).join('');
        }
        return rowHtml(g.n, g.rotulo, g.obs, g.url);
      }).join('');
      return `<div class="day"><div class="dayhead">${d.dia}</div><div class="rows">${rows}</div></div>`;
    }).join('');
    total += cTot;
    grid.insertAdjacentHTML('beforeend', `
      <section class="col">
        <h2>${c.nome}</h2>
        <p class="cdesc">${c.desc}</p>
        <div class="big">${fmt(cTot)}</div>
        <div class="biglab">fotos entregues</div>
        ${diasHtml}
      </section>`);
  });
  document.getElementById('totalN').textContent = fmt(total);

  const root = document.documentElement;
  try{ const t = localStorage.getItem('siemens-theme'); if(t) root.setAttribute('data-theme', t); }catch(e){}
  document.getElementById('theme').addEventListener('click', ()=>{
    const cur = root.getAttribute('data-theme');
    const dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('siemens-theme', next); }catch(e){}
  });
</script>
</body>
</html>
